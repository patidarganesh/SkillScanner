<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillScan - AI Skill Package Security Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.4);
            --border: rgba(255, 255, 255, 0.1);
            --panel: rgba(15, 23, 42, 0.6);
            --text: #f8fafc;
            --muted: #64748b;
            --red: #f43f5e;
            --yellow: #facc15;
            --orange: #f97316;
            --blue: #3b82f6;
            --font-mono: 'JetBrains Mono', monospace;
            --font-head: 'Syne', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08), transparent 25%);
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -2;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 680px;
            padding: 40px 20px;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .fallback-logo {
            font-family: var(--font-head);
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, var(--green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(16, 185, 129, 0.2));
            display: none;
        }

        .main-logo {
            max-width: 250px;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.5));
            transition: transform 0.3s;
        }

        .main-logo:hover {
            transform: scale(1.02);
        }

        .header-title {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 50;
        }

        .header-title p {
            color: var(--muted);
            font-size: 1.05rem;
            margin-bottom: 12px;
        }

        .provider-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .glass-panel {
            background: var(--panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 35px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"], input[type="password"] {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            transition: all 0.2s;
            width: 100%;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 10px var(--green-glow);
            background: rgba(0, 0, 0, 0.6);
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: var(--font-head);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        button.primary {
            background: var(--green);
            color: #000;
            border: none;
            box-shadow: 0 0 15px var(--green-glow);
        }

        button.primary:hover {
            background: #059669;
            color: #fff;
            box-shadow: 0 0 20px var(--green-glow);
        }

        .btn-settings {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--green);
            padding: 7px 12px;
            font-size: 0.85rem;
            border-radius: 8px;
        }

        .btn-settings:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--green);
            color: #fff;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .divider:not(:empty)::before {
            margin-right: 15px;
        }

        .divider:not(:empty)::after {
            margin-left: 15px;
        }

        .upload-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .upload-actions button {
            padding: 20px;
            flex-direction: column;
            gap: 12px;
            border-style: dashed;
            background: rgba(0, 0, 0, 0.2);
        }

        .upload-actions button:hover {
            border-color: var(--green);
            background: rgba(16, 185, 129, 0.05);
        }

        .upload-actions button span {
            font-size: 1.5rem;
        }

        .test-btn {
            width: 100%;
            margin-top: 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--muted);
            font-size: 0.85rem;
            padding: 8px;
        }

        .test-btn:hover {
            color: #fff;
            border-color: var(--border);
        }

        .footer-info {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.8;
        }

        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        .loader-ring {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(16, 185, 129, 0.2);
            border-radius: 50%;
            border-top-color: var(--green);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Custom Dropdown */
        .custom-select {
            position: relative;
            user-select: none;
        }

        .select-selected {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 12px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .select-selected:hover {
            border-color: rgba(16, 185, 129, 0.5);
        }

        .custom-select.open .select-selected {
            border-color: var(--green);
            border-radius: 8px 8px 0 0;
        }

        .custom-select.open .select-selected svg {
            transform: rotate(180deg);
        }

        .select-selected svg {
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .select-items {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #0a111e;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-top: none;
            border-radius: 0 0 8px 8px;
            z-index: 9999;
            max-height: 240px;
            overflow-y: auto;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
        }

        .custom-select.open .select-items {
            display: block;
        }

        .select-items div {
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            background: #0a111e;
        }

        .select-items div:last-child {
            border-bottom: none;
        }

        .select-items div:hover {
            background: rgba(16, 185, 129, 0.15);
            color: #e2e8f0;
            padding-left: 16px;
        }

        .select-items div.selected {
            background: rgba(16, 185, 129, 0.2);
            color: var(--green);
            font-weight: bold;
        }

        .select-items::-webkit-scrollbar {
            width: 5px;
        }

        .select-items::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.3);
            border-radius: 10px;
        }

        /* Settings Modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 14px;
            width: 100%;
            max-width: 580px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(16, 185, 129, 0.1);
            padding: 30px;
            animation: fadeIn 0.25s ease-out;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 14px;
        }

        .modal-header h3 {
            font-family: var(--font-head);
            color: #fff;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .modal-close:hover {
            color: #fff;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .form-group select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .form-group select:focus {
            outline: none;
            border-color: var(--green);
        }

        .provider-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            margin-bottom: 18px;
        }

        .provider-chip {
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            color: #94a3b8;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }

        .provider-chip:hover {
            color: #fff;
            border-color: rgba(16, 185, 129, 0.4);
        }

        .provider-chip.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--green);
            color: var(--green);
            font-weight: bold;
        }

        .quick-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .preset-pill {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .preset-pill:hover {
            border-color: var(--green);
            color: #fff;
        }

        .test-status {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 18px;
            display: none;
            line-height: 1.5;
        }

        .test-status.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--green);
            color: #34d399;
        }

        .test-status.error {
            display: block;
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid var(--red);
            color: #fb7185;
        }

        .test-status.loading {
            display: block;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid var(--blue);
            color: #60a5fa;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='logo-transparent.png') }}" alt="SkillScanner Logo"
                class="main-logo"
                onerror="this.style.display='none'; document.getElementById('fb-logo').style.display='block';">
            <div id="fb-logo" class="fallback-logo">SkillScan</div>
        </div>

        <div class="header-title">
            <p>AI Skill Package Security Scanner</p>
            <div class="provider-controls">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="color: var(--muted); font-size: 0.85rem;">Engine:</span>
                    <div class="custom-select" id="engine-dropdown">
                        <div class="select-selected" onclick="toggleDropdown('engine-dropdown')">
                            <span id="engine-label">Anthropic</span>
                            <svg width="12" height="8" viewBox="0 0 12 8">
                                <path fill="#10b981" d="M0 0l6 8 6-8z" />
                            </svg>
                        </div>
                        <div class="select-items" id="engine-items"></div>
                        <input type="hidden" id="provider-sel" value="anthropic">
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="color: var(--muted); font-size: 0.85rem;">Model:</span>
                    <div class="custom-select" id="model-dropdown" style="min-width: 200px;">
                        <div class="select-selected" onclick="toggleDropdown('model-dropdown')">
                            <span id="model-label">Loading...</span>
                            <svg width="12" height="8" viewBox="0 0 12 8">
                                <path fill="#10b981" d="M0 0l6 8 6-8z" />
                            </svg>
                        </div>
                        <div class="select-items" id="model-items"></div>
                        <input type="hidden" id="model-sel" value="">
                    </div>
                </div>
                <button class="btn-settings" onclick="openSettingsModal()" title="Configure AI Provider & Keys">⚙️ Settings</button>
            </div>
        </div>

        <div class="glass-panel" style="position: relative;">
            <div id="loader" class="loader-overlay">
                <div class="loader-ring"></div>
                <div style="color: #10b981; font-weight: bold;" id="loader-text">Analyzing Package...</div>
            </div>

            <div class="input-group">
                <label>📁 Local Path Analysis</label>
                <div class="input-row">
                    <input type="text" id="path-input" placeholder="C:\path\to\skill-package or /path/to/skill"
                        onkeypress="if(event.key === 'Enter') analysePath()">
                    <button class="primary" onclick="analysePath()" id="btn-path">Analyse &rarr;</button>
                </div>
            </div>

            <div class="divider"><span>Or upload directly</span></div>

            <div class="upload-actions">
                <button onclick="document.getElementById('zip-input').click()"><span>📦</span>Upload ZIP</button>
                <button onclick="document.getElementById('folder-input').click()"><span>📁</span>Upload Folder</button>
                <input type="file" id="zip-input" style="display: none" accept=".zip" onchange="handleZipUpload(event)">
                <input type="file" id="folder-input" style="display: none" webkitdirectory directory multiple
                    onchange="handleFolderUpload(event)">
            </div>

            <button class="test-btn" onclick="testWithDummyData()">Run Demo with Dummy Data</button>
        </div>

        <div class="glass-panel" style="margin-top: 25px; text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
                <h3 style="color: var(--green); font-size: 1.15rem; margin: 0;">🕒 Analysis History</h3>
                <button onclick="clearHistory()"
                    style="padding: 5px 10px; font-size: 0.8rem; border-color: rgba(244, 63, 94, 0.4); color: var(--red);">Clear
                    All</button>
            </div>
            <div id="history-list"
                style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; padding-right: 5px;">
                <div style="color: var(--muted); text-align: center; font-style: italic; padding: 20px 0;">Loading
                    history...</div>
            </div>
        </div>

        <div class="footer-info">
            Supports: Single Files &middot; Nested Directories &middot; ZIP Archives<br>
            <span id="provider-count-label">200+ AI Providers</span><br>
            <a href="https://github.com/patidarganesh/SkillScanner" target="_blank"
                style="color: var(--muted); text-decoration: underline; display: inline-block; margin-top: 6px;">SkillScanner on GitHub</a>
        </div>
    </div>

    <!-- SETTINGS MODAL (Full 200+ provider catalog) -->
    <div id="settings-modal" class="modal-backdrop" onclick="if(event.target===this)closeSettingsModal()">
        <div class="modal-card" style="max-width:680px;">
            <div class="modal-header">
                <h3>⚙️ AI Engine Settings</h3>
                <div style="display:flex;gap:8px;align-items:center;">
                    <span id="modal-catalog-badge" style="font-size:0.7rem;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:var(--green);padding:3px 8px;border-radius:6px;">Loading...</span>
                    <button class="modal-close" onclick="closeSettingsModal()">&times;</button>
                </div>
            </div>

            <!-- Provider Search + Quick Tabs -->
            <div class="form-group" style="margin-bottom:14px;">
                <div style="display:flex;gap:8px;margin-bottom:10px;">
                    <input type="text" id="modal-provider-search" placeholder="🔍 Search providers..." oninput="filterModalProviders(this.value)" style="flex:1;padding:8px 12px;font-size:0.85rem;">
                    <button type="button" onclick="filterModalProviders('',true)" id="modal-tab-popular" class="tab-btn active" style="padding:6px 12px;font-size:0.78rem;">⭐ Popular</button>
                    <button type="button" onclick="filterModalProviders('',false,'local')" id="modal-tab-local" class="tab-btn" style="padding:6px 12px;font-size:0.78rem;">🖥 Local</button>
                    <button type="button" onclick="filterModalProviders('',false,'all')" id="modal-tab-all" class="tab-btn" style="padding:6px 12px;font-size:0.78rem;">All</button>
                </div>
                <div id="modal-provider-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;max-height:220px;overflow-y:auto;padding-right:4px;"></div>
            </div>

            <!-- Selected provider config -->
            <div id="modal-provider-config" style="border-top:1px solid rgba(255,255,255,0.07);padding-top:16px;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
                    <div id="modal-provider-name-badge" style="font-family:var(--font-head);font-size:1rem;font-weight:700;color:#fff;">—</div>
                    <div id="modal-provider-api-badge" style="font-size:0.7rem;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
                    <button type="button" onclick="autoFetchModels()" id="btn-refresh-models" style="font-size:0.75rem;padding:5px 10px;border-color:rgba(16,185,129,0.3);color:var(--green);">↻ Fetch Models</button>
                </div>

                <div class="form-group" id="group-api-key">
                    <label>
                        <span>API Key</span>
                        <span id="modal-key-status" style="font-size:0.75rem;color:var(--muted);"></span>
                    </label>
                    <div style="display:flex;gap:8px;">
                        <input type="password" id="modal-api-key" placeholder="sk-... or API key">
                        <button type="button" onclick="toggleKeyVisibility()" style="padding:8px 12px;font-size:0.85rem;">👁️</button>
                    </div>
                    <div id="modal-env-hint" style="font-size:0.72rem;color:var(--muted);margin-top:5px;"></div>
                </div>

                <div class="form-group" id="group-base-url" style="display:none;">
                    <label>Base URL / Endpoint</label>
                    <input type="text" id="modal-base-url" placeholder="http://localhost:11434">
                </div>

                <div class="form-group">
                    <label style="justify-content:space-between;">
                        <span>Model</span>
                        <span id="modal-model-count" style="font-size:0.72rem;color:var(--muted);"></span>
                    </label>
                    <input type="text" id="modal-model-name" placeholder="model-name" oninput="filterModelList(this.value)">
                    <div id="modal-model-list" style="max-height:150px;overflow-y:auto;margin-top:6px;border:1px solid var(--border);border-radius:8px;display:none;"></div>
                </div>
            </div>

            <div id="test-status-box" class="test-status"></div>

            <div style="display:flex;justify-content:space-between;gap:10px;margin-top:20px;">
                <button type="button" onclick="testCurrentModalConnection()" style="border-color:rgba(59,130,246,0.4);color:var(--blue);">⚡ Test Connection</button>
                <button type="button" class="primary" onclick="saveSettingsFromModal()">Save &amp; Apply</button>
            </div>
        </div>
    </div>

    <style>
        .tab-btn { background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);border-radius:6px;cursor:pointer;transition:all 0.15s;font-family:var(--font-mono); }
        .tab-btn.active,.tab-btn:hover { background:rgba(16,185,129,0.15);border-color:rgba(16,185,129,0.5);color:var(--green); }
        .provider-chip { padding:7px 10px;border-radius:8px;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:#94a3b8;font-size:0.75rem;cursor:pointer;text-align:center;transition:all 0.15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
        .provider-chip:hover { color:#fff;border-color:rgba(16,185,129,0.4); }
        .provider-chip.active { background:rgba(16,185,129,0.15);border-color:var(--green);color:var(--green);font-weight:bold; }
        .provider-chip.has-key::after { content:'✓';float:right;color:var(--green);font-size:0.65rem; }
        .model-list-item { padding:7px 12px;font-size:0.82rem;color:#94a3b8;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);background:#0a111e;transition:all 0.12s; }
        .model-list-item:last-child { border-bottom:none; }
        .model-list-item:hover,.model-list-item.selected { background:rgba(16,185,129,0.15);color:#e2e8f0; }
        #modal-model-list::-webkit-scrollbar { width:4px; }
        #modal-model-list::-webkit-scrollbar-thumb { background:rgba(16,185,129,0.3);border-radius:4px; }
        #modal-provider-grid::-webkit-scrollbar { width:4px; }
        #modal-provider-grid::-webkit-scrollbar-thumb { background:rgba(16,185,129,0.3);border-radius:4px; }
    </style>
    <script>
        let modelOptions = {};       // providerID -> [model list]
        let providersMeta = {};      // providerID -> meta (name, api, env, has_key, etc)
        let popularProviders = [];   // from backend
        let localProviders = [];     // from backend
        let allProviderIds = [];     // sorted list
        let currentActiveProvider = 'anthropic';
        let modalSelectedProvider = 'anthropic';
        let modalAllModels = [];     // full model list for current modal provider
        let _modalTab = 'popular';   // current tab
        let _modalSearch = '';       // current search

        // ========== FETCH CONFIG & BUILD MAIN UI ===========
        async function fetchConfig() {
            try {
                const r = await fetch('/config');
                const data = await r.json();
                modelOptions   = data.options || {};
                providersMeta  = data.providers_meta || {};
                popularProviders = data.popular_providers || Object.keys(providersMeta).slice(0,16);
                localProviders   = data.local_providers || ['ollama','lmstudio','custom'];
                allProviderIds   = data.all_providers || Object.keys(providersMeta).sort();

                currentActiveProvider = data.provider || data.current_provider || 'anthropic';
                const activeModel = data.model || data.current_model || '';

                // Update footer badge
                const badge = document.getElementById('provider-count-label');
                if (badge && data.total_providers) badge.textContent = data.total_providers + '+ AI Providers';

                // Build engine dropdown (show popular + current)
                const engineItems = document.getElementById('engine-items');
                engineItems.innerHTML = '';
                const toShow = [...new Set([...popularProviders, currentActiveProvider])];
                toShow.forEach(key => {
                    const meta = providersMeta[key] || {};
                    const div = document.createElement('div');
                    div.textContent = (meta.name || key);
                    div.dataset.value = key;
                    if (key === currentActiveProvider) div.classList.add('selected');
                    div.onclick = () => selectEngine(key);
                    engineItems.appendChild(div);
                });
                // Separator + all others
                if (allProviderIds.length > toShow.length) {
                    const sep = document.createElement('div');
                    sep.textContent = '─── More providers in Settings ───';
                    sep.style.cssText = 'color:var(--muted);font-size:0.72rem;text-align:center;padding:6px;cursor:default;pointer-events:none;';
                    engineItems.appendChild(sep);
                }

                const curMeta = providersMeta[currentActiveProvider] || {};
                document.getElementById('engine-label').textContent = curMeta.name || currentActiveProvider;
                document.getElementById('provider-sel').value = currentActiveProvider;

                buildModelDropdown(currentActiveProvider, activeModel);
            } catch (e) {
                console.error('Config fetch error:', e);
            }
        }

        function buildModelDropdown(provider, selectedModel) {
            const modelItems = document.getElementById('model-items');
            modelItems.innerHTML = '';
            const opts = (modelOptions[provider] || []);
            const chosen = (selectedModel && selectedModel.length > 0) ? selectedModel : (opts[0] || '');

            opts.forEach(m => {
                const div = document.createElement('div');
                div.textContent = m;
                div.dataset.value = m;
                if (m === chosen) div.classList.add('selected');
                div.onclick = () => selectModel(m);
                modelItems.appendChild(div);
            });

            document.getElementById('model-label').textContent = chosen || 'Pick model';
            document.getElementById('model-sel').value = chosen;
        }

        function selectEngine(key) {
            currentActiveProvider = key;
            document.getElementById('provider-sel').value = key;
            const meta = providersMeta[key] || {};
            document.getElementById('engine-label').textContent = meta.name || key;
            document.querySelectorAll('#engine-items div').forEach(d => {
                d.classList.toggle('selected', d.dataset.value === key);
            });
            closeAllDropdowns();
            buildModelDropdown(key, null);
            saveConfig(key, document.getElementById('model-sel').value);
        }

        function selectModel(model) {
            document.getElementById('model-sel').value = model;
            document.getElementById('model-label').textContent = model;
            document.querySelectorAll('#model-items div').forEach(d => {
                d.classList.toggle('selected', d.dataset.value === model);
            });
            closeAllDropdowns();
            saveConfig(document.getElementById('provider-sel').value, model);
        }

        function toggleDropdown(id) {
            const el = document.getElementById(id);
            const wasOpen = el.classList.contains('open');
            closeAllDropdowns();
            if (!wasOpen) el.classList.add('open');
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.custom-select').forEach(s => s.classList.remove('open'));
        }

        document.addEventListener('click', e => {
            if (!e.target.closest('.custom-select')) closeAllDropdowns();
        });

        async function saveConfig(provider, model, apiKey, baseUrl) {
            try {
                const payload = { provider, model };
                if (apiKey !== undefined) payload.api_key = apiKey;
                if (baseUrl !== undefined) payload.base_url = baseUrl;
                await fetch('/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error('Failed to save config', e);
            }
        }

        // ========== SETTINGS MODAL ===========
        function openSettingsModal() {
            modalSelectedProvider = currentActiveProvider;
            _modalTab = 'popular';
            _modalSearch = '';
            document.getElementById('modal-provider-search').value = '';
            ['modal-tab-popular','modal-tab-local','modal-tab-all'].forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
            document.getElementById('modal-tab-popular').classList.add('active');

            // Badge
            const badge = document.getElementById('modal-catalog-badge');
            if (badge) badge.textContent = (allProviderIds.length || '200') + '+ providers';

            renderModalProviderGrid();
            populateModalFields(modalSelectedProvider);
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').style.display = 'none';
            document.getElementById('test-status-box').style.display = 'none';
            document.getElementById('modal-model-list').style.display = 'none';
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeSettingsModal();
        });

        function filterModalProviders(search, isPopular, tabOverride) {
            _modalSearch = search !== undefined ? search : _modalSearch;
            if (tabOverride) _modalTab = tabOverride;
            else if (isPopular === true) _modalTab = 'popular';

            // Update tab buttons
            document.getElementById('modal-tab-popular').classList.toggle('active', _modalTab === 'popular');
            document.getElementById('modal-tab-local').classList.toggle('active', _modalTab === 'local');
            document.getElementById('modal-tab-all').classList.toggle('active', _modalTab === 'all');

            renderModalProviderGrid();
        }

        function renderModalProviderGrid() {
            const grid = document.getElementById('modal-provider-grid');
            grid.innerHTML = '';

            let ids;
            if (_modalSearch.trim().length > 0) {
                const q = _modalSearch.toLowerCase();
                ids = allProviderIds.filter(id => {
                    const meta = providersMeta[id] || {};
                    return id.includes(q) || (meta.name || '').toLowerCase().includes(q);
                });
            } else if (_modalTab === 'popular') {
                ids = popularProviders.filter(id => providersMeta[id]);
            } else if (_modalTab === 'local') {
                ids = localProviders.filter(id => providersMeta[id]);
            } else {
                ids = allProviderIds;
            }

            if (ids.length === 0) {
                grid.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;padding:12px;grid-column:1/-1;text-align:center;">No providers found</div>';
                return;
            }

            ids.forEach(key => {
                const meta = providersMeta[key] || {};
                const chip = document.createElement('div');
                chip.className = 'provider-chip' + (key === modalSelectedProvider ? ' active' : '') + (meta.has_key ? ' has-key' : '');
                chip.title = (meta.name || key) + (meta.models_count ? ' (' + meta.models_count + ' models)' : '');
                chip.textContent = meta.name || key;
                chip.onclick = () => {
                    modalSelectedProvider = key;
                    renderModalProviderGrid();
                    populateModalFields(key);
                };
                grid.appendChild(chip);
            });
        }

        async function populateModalFields(provider) {
            const meta = providersMeta[provider] || {};
            const isLocal = localProviders.includes(provider);
            const isCustom = provider === 'custom';

            // Provider header
            document.getElementById('modal-provider-name-badge').textContent = meta.name || provider;
            const apiBadge = document.getElementById('modal-provider-api-badge');
            apiBadge.textContent = meta.base_url || meta.api || (isLocal ? 'Local runtime' : '');

            // Key group
            const keyGroup = document.getElementById('group-api-key');
            const keyStatus = document.getElementById('modal-key-status');
            if (isLocal && !isCustom) {
                keyGroup.style.display = 'none';
            } else {
                keyGroup.style.display = 'block';
                keyStatus.textContent = meta.has_key ? '✅ Key configured' : '⚠️ No key set';
                keyStatus.style.color = meta.has_key ? 'var(--green)' : 'var(--orange)';
                document.getElementById('modal-api-key').value = '';
                document.getElementById('modal-api-key').placeholder = meta.has_key ? '●●●●●● (leave blank to keep)' : 'Paste API key...';
                // Show env hint
                const envHint = document.getElementById('modal-env-hint');
                if (meta.env_vars && meta.env_vars.length) {
                    envHint.textContent = 'Env var: ' + meta.env_vars.join(', ');
                } else {
                    envHint.textContent = '';
                }
            }

            // Base URL
            const urlGroup = document.getElementById('group-base-url');
            if (isLocal || isCustom) {
                urlGroup.style.display = 'block';
                document.getElementById('modal-base-url').value = meta.base_url || (provider === 'ollama' ? 'http://localhost:11434' : provider === 'lmstudio' ? 'http://localhost:1234/v1' : 'http://localhost:8000/v1');
            } else {
                urlGroup.style.display = 'none';
            }

            // Model input
            const modelInput = document.getElementById('modal-model-name');
            modelInput.value = meta.model || (modelOptions[provider] || [])[0] || '';

            // Load models list
            await loadModalModelList(provider);
        }

        async function loadModalModelList(provider) {
            const listEl = document.getElementById('modal-model-list');
            const countEl = document.getElementById('modal-model-count');
            listEl.innerHTML = '<div class="model-list-item" style="color:var(--muted);">Fetching models...</div>';
            listEl.style.display = 'block';

            try {
                const apiKey = document.getElementById('modal-api-key').value.trim();
                const baseUrl = document.getElementById('modal-base-url').value.trim();
                const res = await fetch('/api/auto-fetch-models', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ provider, api_key: apiKey || undefined, base_url: baseUrl || undefined })
                });
                const data = await res.json();
                modalAllModels = data.models || modelOptions[provider] || [];
                modelOptions[provider] = modalAllModels;

                const src = data.source === 'live' ? '🟢 Live' : '📁 Catalog';
                countEl.textContent = src + ' · ' + modalAllModels.length + ' models';
                renderModalModelList(modalAllModels, document.getElementById('modal-model-name').value);
            } catch (e) {
                modalAllModels = modelOptions[provider] || [];
                countEl.textContent = '📁 ' + modalAllModels.length + ' models';
                renderModalModelList(modalAllModels, document.getElementById('modal-model-name').value);
            }
        }

        function renderModalModelList(models, selected) {
            const listEl = document.getElementById('modal-model-list');
            listEl.innerHTML = '';
            if (!models.length) {
                listEl.innerHTML = '<div class="model-list-item" style="color:var(--muted);">No models — type custom name above</div>';
                listEl.style.display = 'block';
                return;
            }
            listEl.style.display = 'block';
            models.forEach(m => {
                const item = document.createElement('div');
                item.className = 'model-list-item' + (m === selected ? ' selected' : '');
                item.textContent = m;
                item.onclick = () => {
                    document.getElementById('modal-model-name').value = m;
                    document.querySelectorAll('.model-list-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                };
                listEl.appendChild(item);
            });
        }

        function filterModelList(q) {
            const filtered = q ? modalAllModels.filter(m => m.toLowerCase().includes(q.toLowerCase())) : modalAllModels;
            renderModalModelList(filtered, document.getElementById('modal-model-name').value);
        }

        async function autoFetchModels() {
            const btn = document.getElementById('btn-refresh-models');
            btn.textContent = '⏳';
            btn.disabled = true;
            await loadModalModelList(modalSelectedProvider);
            btn.textContent = '↻ Fetch Models';
            btn.disabled = false;
        }

        function toggleKeyVisibility() {
            const inp = document.getElementById('modal-api-key');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }

        async function testCurrentModalConnection() {
            const statusBox = document.getElementById('test-status-box');
            statusBox.className = 'test-status loading';
            statusBox.textContent = 'Testing connection...';
            statusBox.style.display = 'block';

            const apiKey = document.getElementById('modal-api-key').value.trim();
            const baseUrl = document.getElementById('modal-base-url').value.trim();
            const model = document.getElementById('modal-model-name').value.trim();

            try {
                const res = await fetch('/api/test-connection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: modalSelectedProvider,
                        api_key: apiKey || undefined,
                        base_url: baseUrl || undefined,
                        model: model || undefined
                    })
                });
                const data = await res.json();
                statusBox.className = 'test-status ' + (data.success ? 'success' : 'error');
                statusBox.textContent = (data.success ? '✅ ' + data.message : '❌ ' + (data.error || 'Connection failed'));
            } catch (e) {
                statusBox.className = 'test-status error';
                statusBox.textContent = '❌ Request error: ' + e.message;
            }
        }

        async function saveSettingsFromModal() {
            const apiKey = document.getElementById('modal-api-key').value.trim();
            const baseUrl = document.getElementById('modal-base-url').value.trim();
            const model = document.getElementById('modal-model-name').value.trim();

            await saveConfig(modalSelectedProvider, model, apiKey || undefined, baseUrl || undefined);
            closeSettingsModal();
            await fetchConfig();
        }

        /* --- HISTORY LOGIC --- */
        async function loadHistory() {
            try {
                const res = await fetch('/api/scans');
                const data = await res.json();
                if (!data.success) return;

                const list = document.getElementById('history-list');
                list.innerHTML = '';

                if (data.history.length === 0) {
                    list.innerHTML = '<div style="color: var(--muted); text-align: center; font-style: italic; padding: 20px 0;">No past analyses found.</div>';
                    return;
                }

                data.history.forEach(item => {
                    const d = new Date(item.timestamp * 1000);
                    const dtStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    const verd = (item.verdict || '').toLowerCase();
                    const verdColor = (verd === 'trusted' || verd === 'clean' || verd === 'strong') ? 'var(--green)' :
                        (verd === 'malicious' || verd === 'critical') ? 'var(--red)' : 'var(--yellow)';

                    const el = document.createElement('div');
                    el.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border);";
                    el.innerHTML = `
                        <div style="flex-grow: 1; cursor: pointer;" onclick="window.location.href='/results/${item.id}'">
                            <div style="color: #fff; font-weight: bold; font-family: var(--font-head); margin-bottom: 4px;">${item.name}</div>
                            <div style="color: var(--muted); font-size: 0.8rem; display: flex; gap: 15px;">
                                <span>${dtStr}</span>
                                <span style="color: ${verdColor}; font-weight: 500;">
                                    Score: ${item.score} &middot; ${item.verdict || 'Scan'}
                                </span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 8px; margin-left: 15px;">
                            <button onclick="renameScan('${item.id}', '${item.name.replace(/'/g, "\\'")}')" style="padding: 6px; font-size: 0.85rem;" title="Rename">✏️</button>
                            <button onclick="deleteScan('${item.id}')" style="padding: 6px; font-size: 0.85rem; color: var(--red);" title="Delete">🗑️</button>
                        </div>
                    `;
                    list.appendChild(el);
                });
            } catch (e) {
                console.error('History load error', e);
            }
        }

        async function renameScan(id, currentName) {
            const newName = prompt("Enter new name for this scan:", currentName);
            if (!newName || newName.trim() === currentName) return;
            try {
                await fetch(`/api/scan/${id}`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName.trim() })
                });
                loadHistory();
            } catch (e) { alert("Failed to rename scan."); }
        }

        async function deleteScan(id) {
            if (!confirm("Delete this scan?")) return;
            try {
                await fetch(`/api/scan/${id}`, { method: 'DELETE' });
                loadHistory();
            } catch (e) { alert("Failed to delete scan."); }
        }

        async function clearHistory() {
            if (!confirm("Permanently clear ALL past analyses?")) return;
            try {
                await fetch('/api/scans', { method: 'DELETE' });
                loadHistory();
            } catch (e) { alert("Failed to clear history."); }
        }

        fetchConfig();
        loadHistory();

        function setUploading(state, text) {
            const loader = document.getElementById('loader');
            if (text) document.getElementById('loader-text').textContent = text;
            loader.style.display = state ? 'flex' : 'none';
        }

        async function analysePath() {
            let path = document.getElementById('path-input').value.trim();
            path = path.replace(/^["']|["']$/g, '');
            if (!path) return alert('Please enter a local file or folder path');

            setUploading(true, "Scanning path...");
            try {
                const res = await fetch('/analyse', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                window.location.href = `/results/${data.scan_id}`;
            } catch (err) {
                alert(`Error: ${err.message}`); setUploading(false);
            }
        }

        async function handleZipUpload(e) {
            if (!e.target.files.length) return;
            const file = e.target.files[0];
            if (!file.name.toLowerCase().endsWith('.zip')) return alert('Must be a .zip file');

            setUploading(true, "Uploading ZIP...");
            const formData = new FormData(); formData.append('file', file);

            try {
                const res = await fetch('/analyse-zip', { method: 'POST', body: formData });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                window.location.href = `/results/${data.scan_id}`;
            } catch (err) {
                alert(`Error: ${err.message}`); setUploading(false);
            }
        }

        async function handleFolderUpload(e) {
            if (!e.target.files.length) return;
            const files = e.target.files;

            setUploading(true, `Uploading ${files.length} files...`);
            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                const path = files[i].webkitRelativePath || files[i].name;
                formData.append('files', files[i]);
                formData.append('paths', path);
            }

            try {
                const res = await fetch('/analyse-folder-upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                window.location.href = `/results/${data.scan_id}`;
            } catch (err) {
                alert(`Error: ${err.message}`); setUploading(false);
            }
        }

        async function testWithDummyData() {
            setUploading(true, "Loading demo analysis...");
            try {
                const res = await fetch('/api/dummy', { method: 'POST' });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                window.location.href = `/results/${data.scan_id}`;
            } catch (err) {
                alert(`Error: ${err.message}`); setUploading(false);
            }
        }
    </script>
</body>

</html>
